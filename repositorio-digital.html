<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio Digital - Terminal Docente</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav style="display: flex; gap: 2rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; align-items: center;">
            <a href="dashboard-supervisora.html" style="text-decoration: none; color: var(--secondary-color);">Dashboard</a>
            <a href="repositorio-digital.html" style="text-decoration: none; color: var(--primary-color); font-weight: 700;">Repositorio Digital</a>
            <a href="inventario.html" style="text-decoration: none; color: var(--secondary-color);">Stock e Inventario</a>
            <a href="consultas.html" style="text-decoration: none; color: var(--secondary-color);">Consultas</a>
            <button class="btn btn-ghost" onclick="AppData.logout()" style="margin-left: auto; color: var(--danger)">
                <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
            </button>
        </nav>
        <header>
            <div class="welcome-text">
                <a href="dashboard-supervisora.html" style="text-decoration: none; color: var(--secondary-color); font-size: 0.875rem;">← Volver al Dashboard</a>
                <h1 style="margin-top: 0.5rem">Repositorio Digital</h1>
                <p>Base de datos de documentos oficiales y pedagógicos</p>
            </div>
            <button class="btn btn-primary" onclick="UI.openModal()">+ Subir Documento</button>
        </header>

        <section class="section-card">
            <div class="section-header">
                <h2>Documentos Disponibles</h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre del Archivo</th>
                            <th>Tipo</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="docs-table-body">
                        <!-- Rendered by app.js -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Modal para Nuevo Documento -->
        <div class="modal-overlay" id="modal-nuevo-doc">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Subir Nuevo Documento</h3>
                    <button class="btn btn-ghost" onclick="UI.closeModal()"><i data-lucide="x"></i></button>
                </div>
                <form id="form-doc">
                    <div class="form-group">
                        <label>Nombre del Documento</label>
                        <input type="text" name="nombre" placeholder="Ej: Acta de Reunión.pdf" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select name="tipo">
                            <option>Pedagógico</option>
                            <option>Administrativo</option>
                            <option>Legal</option>
                            <option>Otro</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem">Subir Archivo</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const UI = {
            openModal: () => document.getElementById('modal-nuevo-doc').style.display = 'flex',
            closeModal: () => document.getElementById('modal-nuevo-doc').style.display = 'none'
        };

        document.getElementById('form-doc').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.fecha = new Date().toLocaleDateString();
            AppData.addItem('documentos', data);
            UI.closeModal();
            e.target.reset();
        });

        lucide.createIcons();
    </script>
</body>
</html>
